services:
  postgres:
    image: postgres:16-alpine
    container_name: investtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investtracker}
      POSTGRES_USER: ${POSTGRES_USER:-investtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investtracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investtracker} -d ${POSTGRES_DB:-investtracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
